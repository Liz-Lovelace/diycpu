[package]
name = "diycpu"
version = "0.1.0"
edition = "2021"

[features]
gui = ["dep:femtovg", "dep:glutin", "dep:glutin-winit", "dep:winit", "dep:raw-window-handle", "dep:png", "dep:rfd", "dep:image", "dep:dirs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
femtovg = { version = "0.9", optional = true }
glutin = { version = "0.32", optional = true }
glutin-winit = { version = "0.5", optional = true }
winit = { version = "0.30", optional = true }
raw-window-handle = { version = "0.6", optional = true }
png = { version = "0.17", optional = true }
rfd = { version = "0.15", optional = true }
# Decoding for the image component; the format features flow through to
# femtovg's image integration via cargo feature unification.
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp"] }
dirs = { version = "6", optional = true }

[[bin]]
name = "diycpu"
path = "src/main.rs"

[[bin]]
name = "diycpu-gui"
path = "src/bin/gui/main.rs"
required-features = ["gui"]
